<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | HostelSphere</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="student-page">
    <div class="student-container">
        <h1>Student Registration</h1>
        <p>Create your student account</p>
        <form id="registrationForm">
            <label>Full Name</label>
            <input type="text" id="full_name" placeholder="Enter your full name" required>
            <label>Roll Number</label>
            <input type="text" id="roll_number" placeholder="Enter your roll number" required>
            <label>Department</label>
            <input type="text" id="department" placeholder="Enter your department" required>
            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <label>Home Address</label>
            <textarea id="address" placeholder="Enter your complete home address" rows="3" required></textarea>
            <label>Contact Number</label>
            <input type="tel" id="contact_number" placeholder="03XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
            <label>Guardian Contact Number</label>
            <input type="tel" id="guardian_contact" placeholder="03XXXXXXXXX" pattern="[0-9]{11}" maxlength="11" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" id="password" placeholder="Create password (minimum 8 characters)" minlength="8" required>
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            <button type="submit">Register Now</button>
        </form>
        <p>Have a complaint? <a href="/complaint">Submit Complaint</a></p>
        <p>Already registered? <a href="/student-login">Student Login</a></p>
    </div>
<script>
document.getElementById("registrationForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("confirmPassword").value) {
        alert("Password and Confirm Password do not match!");
        return;
    }
    const data = {
        full_name: document.getElementById("full_name").value.trim(),
        roll_number: document.getElementById("roll_number").value.trim(),
        department: document.getElementById("department").value.trim(),
        contact_number: document.getElementById("contact_number").value,
        guardian_contact: document.getElementById("guardian_contact").value,
        email: document.getElementById("email").value.trim(),
        password,
        gender: document.getElementById("gender").value,
        address: document.getElementById("address").value.trim()
    };
    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = "Registering...";
    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Registration failed.");
        alert(result.message);
        this.reset();
    } catch (error) {
        alert(error.message || "Server connection failed. Start Flask and check the database.");
    } finally {
        button.disabled = false;
        button.textContent = "Register Now";
    }
});
</script>
</body>
</html>
